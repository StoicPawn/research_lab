name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - name: Unit tests
        env:
          LAB_DATA_DIR: ${{ runner.temp }}/research-lab-data
        run: pytest -q
      - run: cp .env.example .env && docker compose config >/dev/null
