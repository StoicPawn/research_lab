name: local-verify-deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-local-main
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, lab-local]
    timeout-minutes: 60

    steps:
      - name: Choose trusted revision
        id: rev
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          clean: true

      - name: Verify on mini-PC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gha-venv
          python3 -m venv .gha-venv
          .gha-venv/bin/python -m pip install --upgrade pip
          .gha-venv/bin/pip install -e ".[dev]"
          .gha-venv/bin/python -m compileall -q src tests
          .gha-venv/bin/pytest -q
          cp .env.example .env.ci
          docker compose --env-file .env.ci config >/dev/null
          rm -f .env.ci

      - name: Deploy tested main
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/research_lab
        run: |
          set -euo pipefail
          test -d "$DEPLOY_DIR/.git"
          test -f "$DEPLOY_DIR/.env"
          if [ -n "$(git -C "$DEPLOY_DIR" status --porcelain --untracked-files=no)" ]; then
            echo "Production checkout has tracked local changes; refusing to overwrite them."
            git -C "$DEPLOY_DIR" status --short
            exit 1
          fi
          git -C "$DEPLOY_DIR" fetch origin main
          git -C "$DEPLOY_DIR" checkout main
          git -C "$DEPLOY_DIR" reset --hard "${{ steps.rev.outputs.sha }}"
          cd "$DEPLOY_DIR"
          docker compose --env-file .env up -d --build --remove-orphans

      - name: Health check
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/research_lab
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          PORT="$(awk -F= '$1=="LAB_PORT" {print $2}' .env | tail -n1)"
          PORT="${PORT:-8300}"
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "Research Lab deploy and health check OK on port ${PORT}"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --tail=150 research-lab || true
          exit 1
