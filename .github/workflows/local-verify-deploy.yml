name: local-verify-deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-lab-local-main
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, lab-local]
    timeout-minutes: 90

    steps:
      - name: Choose trusted revision
        id: rev
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          clean: true

      - name: Verify on mini-PC
        shell: bash
        env:
          LAB_DATA_DIR: ${{ runner.temp }}/research-lab-data
        run: |
          set -euo pipefail
          rm -rf "$LAB_DATA_DIR" .gha-venv
          mkdir -p "$LAB_DATA_DIR"
          python3 -m venv .gha-venv
          .gha-venv/bin/python -m pip install --upgrade pip
          .gha-venv/bin/pip install -e ".[dev]"
          export PATH="$PWD/.gha-venv/bin:$PATH"
          python -m compileall -q src tests
          python -m pytest -q
          cp .env.example .env
          docker network inspect home-lab >/dev/null 2>&1 || docker network create home-lab >/dev/null
          docker compose --env-file .env config >/dev/null
          rm -f .env

      - name: Bootstrap and deploy Research Lab at an idle experiment boundary
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/research_lab
        run: |
          set -euo pipefail
          mkdir -p /home/stoicpawn/projects

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://github.com/StoicPawn/research_lab.git "$DEPLOY_DIR"
          fi

          if [ -n "$(git -C "$DEPLOY_DIR" status --porcelain --untracked-files=no)" ]; then
            echo "Research Lab production checkout has tracked local changes; refusing to overwrite them."
            git -C "$DEPLOY_DIR" status --short
            exit 1
          fi

          git -C "$DEPLOY_DIR" fetch origin main
          git -C "$DEPLOY_DIR" checkout main
          git -C "$DEPLOY_DIR" reset --hard "${{ steps.rev.outputs.sha }}"

          cd "$DEPLOY_DIR"
          if [ ! -f .env ]; then
            cp .env.example .env
            TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            sed -i "s#^LAB_API_TOKEN=.*#LAB_API_TOKEN=${TOKEN}#" .env
          fi

          docker network inspect home-lab >/dev/null 2>&1 || docker network create home-lab >/dev/null

          # Never kill an experiment that Expert My Rules or Tutor LLM is currently
          # using. Existing Lab runs are resource-bounded, so wait for the child
          # process to finish and only then replace the service container.
          if [ -n "$(docker compose --env-file .env ps -q research-lab 2>/dev/null || true)" ]; then
            ACTIVE=0
            for _ in $(seq 1 180); do
              ACTIVE="$(docker compose --env-file .env exec -T research-lab python -c 'from research_lab.processes import active_experiment_count; print(active_experiment_count())' 2>/dev/null || echo 0)"
              ACTIVE="$(printf '%s' "$ACTIVE" | tail -n1 | tr -d '[:space:]')"
              ACTIVE="${ACTIVE:-0}"
              if [ "$ACTIVE" = "0" ]; then
                echo "Research Lab is at an idle experiment boundary."
                break
              fi
              echo "Research Lab still has ${ACTIVE} active experiment(s); waiting without interrupting them."
              sleep 5
            done
            if [ "$ACTIVE" != "0" ]; then
              echo "Timed out waiting for Research Lab to become idle; refusing a disruptive deploy."
              exit 1
            fi
          fi

          docker compose --env-file .env up -d --build --remove-orphans

      - name: Wire Lab credentials for future safe caller restarts
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          LAB_DIR: /home/stoicpawn/projects/research_lab
          EXPERT_ENV: /home/stoicpawn/projects/expert_my_rules/.env
          TUTOR_ENV: /home/stoicpawn/projects/tutor_llm/deploy/.env
        run: |
          set -euo pipefail
          TOKEN="$(awk -F= '$1=="LAB_API_TOKEN" {print substr($0,index($0,"=")+1)}' "$LAB_DIR/.env" | tail -n1)"
          test -n "$TOKEN"

          set_env() {
            FILE="$1"
            KEY="$2"
            VALUE="$3"
            [ -f "$FILE" ] || return 0
            if grep -q "^${KEY}=" "$FILE"; then
              sed -i "s#^${KEY}=.*#${KEY}=${VALUE}#" "$FILE"
            else
              printf '\n%s=%s\n' "$KEY" "$VALUE" >> "$FILE"
            fi
          }

          set_env "$EXPERT_ENV" RESEARCH_LAB_URL http://research-lab:8300
          set_env "$EXPERT_ENV" RESEARCH_LAB_TOKEN "$TOKEN"
          set_env "$TUTOR_ENV" RESEARCH_LAB_URL http://research-lab:8300
          set_env "$TUTOR_ENV" RESEARCH_LAB_TOKEN "$TOKEN"

          echo "Research Lab credentials are staged in caller .env files."
          echo "Connected applications are deliberately NOT restarted here; each project deploys on its own safe policy."

      - name: Health check
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/research_lab
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          PORT="$(awk -F= '$1=="LAB_PORT" {print $2}' .env | tail -n1)"
          PORT="${PORT:-8300}"
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "Research Lab deploy and health check OK on port ${PORT}"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --tail=150 research-lab || true
          exit 1
